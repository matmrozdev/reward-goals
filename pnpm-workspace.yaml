packages:
  - 'apps/*'
  - 'packages/*'
minimumReleaseAge: 4320
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  unrs-resolver: false
overrides:
  decode-uri-component@<=0.4.2: ^0.5.0
  deepmerge-ts: 8.0.0
  mysql2@<3.22.0: ^3.22.0
  uuid@<11.1.1: ^11.1.1
minimumReleaseAgeExclude:
  - deepmerge-ts@8.0.0
  - uuid@11.1.1
audit:
  level: low
  ignore:
    # Expo/Metro tooling depends on image-size, which has no patched release yet.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
patchedDependencies:
  # query-string 7 is CommonJS; keep its decoder callable after the security upgrade to ESM-only 0.5.
  decode-uri-component@0.5.0: patches/decode-uri-component@0.5.0.patch
