packages:
  - 'apps/*'
  - 'packages/*'
minimumReleaseAge: 4320
allowBuilds:
  '@prisma/engines': true
  '@scarf/scarf': false
  prisma: true
  unrs-resolver: false
overrides:
  deepmerge-ts: 8.0.0
  uuid@<11.1.1: ^11.1.1
minimumReleaseAgeExclude:
  - deepmerge-ts@8.0.0
  - uuid@11.1.1
audit:
  level: low
  ignore:
    # Expo/Metro tooling depends on image-size, which has no patched release yet.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
