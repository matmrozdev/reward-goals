appId: ${APP_ID}
name: Sign in with an API-created account
tags:
  - auth
  - critical
  - smoke
---
- launchApp:
    clearState: true
- runScript:
    file: ../../scripts/prepare-auth-user.js
    env:
      CREATE_VIA_API: 'true'
- runFlow:
    file: ../../subflows/login.yaml
    env:
      EMAIL: ${output.auth.email}
      PASSWORD: ${output.auth.password}
- assertVisible:
    id: ${TEST_ID_DASHBOARD_SCREEN}
